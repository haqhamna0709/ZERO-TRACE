
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZERO TRACE | Investigation System</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo">
                ZERO<span>TRACE</span><small>_</small>
            </div>

            <p class="system-label">
                DIGITAL INVESTIGATION SYSTEM
            </p>

            <h1>Welcome Back, Investigator</h1>

            <p class="subtitle">
                Access your investigation dashboard.
            </p>

            <form id="loginForm">

                <label>Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter username"
                    required
                >

                <label>Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >

                <button type="submit">
                    ACCESS SYSTEM →
                </button>

            </form>

            <p id="message"></p>

            <p class="register-text">
                New investigator?
                <a href="#" id="showRegister">Create Account</a>
            </p>

            <p class="footer-text">
                ZERO TRACE © 2026 | ALL SYSTEMS SIMULATED
            </p>

        </section>

    </main>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>

</body>
</html>
